<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            overflow: hidden;
            position: relative;
        }

        /* Decorative background shapes for depth refraction */
        .circle-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            z-index: 1;
        }
        .circle-1 { width: 300px; height: 300px; top: -50px; left: -50px; opacity: 0.2; }
        .circle-2 { width: 400px; height: 400px; bottom: -100px; right: -50px; opacity: 0.15; }

        /* Glassmorphic Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 32px;
        }

        /* Form Grouping */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Floating label logic using pure CSS */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px;
            left: 12px;
            font-size: 0.8rem;
            color: #3b82f6;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Options Layer */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 0.87rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #94a3b8;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            accent-color: #3b82f6;
        }

        .forgot-pass {
            color: #3b82f6;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        /* CTA Button */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            outline: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .login-btn:hover {
            background: #2563eb;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Footer Link */
        .form-footer {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="circle-shape circle-1"></div>
    <div class="circle-shape circle-2"></div>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please enter your credentials to login</p>
        
        <form autocomplete="off">
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="username">
                <label for="email">Email Address</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                <label for="password">Password</label>
            </div>
            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a href="#">Create account</a>
        </div>
    </div>

</body>
</html>
